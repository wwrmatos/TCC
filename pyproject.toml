[project]
name = "tcc"
version = "0.1.0"
description = "TCC — criminalidade e distribuição de delegacias no Distrito Federal"
requires-python = ">=3.13"
dependencies = [
    "branca>=0.8.2",
    "fastexcel>=0.20.2",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "polars>=1.40.1",
    "pyogrio>=0.12.1",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "plotly>=6.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc"]
